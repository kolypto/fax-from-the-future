<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        {{ $title := site.Title }}
        {{ if not .IsHome }}{{ $title = printf "%s — %s" .Title site.Title }}{{ end }}
        <title>{{ $title }}</title>
        <link rel="canonical" href="{{ .Permalink }}" />
        <meta property="og:title" content="{{ $title }}" />
        <meta property="og:description" content="{{ $title }}" />
        <meta property="og:url" content="{{ .Permalink }}" />
        <meta property="og:type" content="website" />
        <link rel="stylesheet" href="{{ "style.css" | relURL }}" />
    </head>
    <body{{ if eq .Type "commentary" }} class="commentary-page"{{ end }}>
        <header>
            <div>
                <a href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
                {{ with site.GetPage "/toc" }}
                <a href="{{ .RelPermalink }}">Оглавление</a>
                {{ end }}
            </div>
            {{ partial "book-nav.html" . }}
        </header>

        <main>{{ block "main" . }}{{ end }}</main>

        <footer>
            {{ partial "book-nav.html" . }}
        </footer>
    </body>
</html>
